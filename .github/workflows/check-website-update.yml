name: Check website update publisher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-website-update.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check booking page and publisher
        shell: bash
        run: |
          set -euo pipefail
          base='https://medidate-v604-fast-booking-blob-oid.vercel.app'
          for i in {1..18}; do
            code=$(curl -L -sS -o booking.html -w '%{http_code}' "$base/" || true)
            pcode=$(curl -L -sS -o publisher.html -w '%{http_code}' "$base/api/site-publish-update" || true)
            echo "booking=$code publisher=$pcode"
            if [ "$code" = "200" ] && [ "$pcode" = "200" ]               && ! grep -q 'Akut – offene Sprechstunde' booking.html               && ! grep -q 'Akute Beschwerden / offene Sprechstunde' booking.html               && grep -q 'Aktualisierte Praxiswebsite übertragen' publisher.html; then
              exit 0
            fi
            sleep 10
          done
          exit 1
