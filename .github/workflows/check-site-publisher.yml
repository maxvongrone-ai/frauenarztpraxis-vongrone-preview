name: Check temporary site publisher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-site-publisher.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check publisher page
        shell: bash
        run: |
          set -euo pipefail
          url='https://medidate-v604-fast-booking-blob-oid.vercel.app/api/site-publish'
          for i in {1..18}; do
            code=$(curl -L -sS -o page.html -w '%{http_code}' "$url" || true)
            echo "HTTP $code"
            head -c 180 page.html || true
            echo
            if [ "$code" = "200" ] && grep -q 'Praxiswebsite veröffentlichen' page.html; then
              exit 0
            fi
            sleep 10
          done
          exit 1
