name: Delete tracking test 08-26

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-tracking-test-0826.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete exact test tracking event
        shell: bash
        run: |
          set -euo pipefail
          url='https://medidate-v604-fast-booking-blob-oid.vercel.app/api/delete-tracking-test-once'
          for i in {1..12}; do
            code=$(curl -sS -o response.json -w '%{http_code}' "$url" || true)
            cat response.json || true
            echo
            if [ "$code" = "200" ]; then
              exit 0
            fi
            if [ "$code" = "409" ]; then
              echo "Cleanup endpoint returned conflict; not retrying."
              exit 1
            fi
            sleep 10
          done
          exit 1
