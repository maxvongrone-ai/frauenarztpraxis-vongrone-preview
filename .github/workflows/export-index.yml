name: Export practice website index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-index.yml'
      - '.export-index-trigger'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: practice-website-index
          path: website/index.html
          if-no-files-found: error
